<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTU System Software - Most Repeated Questions</title>
    <style>
        :root {
            --primary: #6366F1;
            --secondary: #10B981;
            --dark: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem;
            min-height: 100vh;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818CF8, #34D399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .questions-grid {
            display: grid;
            gap: 1.5rem;
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out backwards;
        }

        .question-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(30, 41, 59, 0.9);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .badges {
            display: flex;
            gap: 0.75rem;
        }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge.freq {
            background: rgba(99, 102, 241, 0.2);
            color: #818CF8;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .badge.freq.high {
            background: rgba(239, 68, 68, 0.2);
            color: #F87171;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .badge.marks {
            background: rgba(16, 185, 129, 0.2);
            color: #34D399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 500;
            line-height: 1.5;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>GTU System Software (3160715)</h1>
            <p class="subtitle">Comprehensive Analysis of Most Repeated Questions across 8 Exam Papers</p>
        </header>

        <div class="filters">
            <button class="filter-btn active" onclick="filterQuestions(0)">All Questions</button>
            <button class="filter-btn" onclick="filterQuestions(5)">5+ Times</button>
            <button class="filter-btn" onclick="filterQuestions(4)">4 Times</button>
            <button class="filter-btn" onclick="filterQuestions(3)">3 Times</button>
            <button class="filter-btn" onclick="filterQuestions(2)">2 Times</button>
            <button class="filter-btn" onclick="filterQuestions(1)">1 Time</button>
        </div>

        <div class="questions-grid" id="questionsContainer">
            <!-- Content will be injected by JavaScript -->
        </div>
    </div>

    <script>
        const questionsData = [
            { text: "Explain assembler directives (ORIGIN, EQU, LTORG, START, END) with suitable examples.", freq: 6, marks: "3, 4, 7" },
            { text: "Eliminate left recursion from the given grammar. (Various examples)", freq: 5, marks: "3, 4" },
            { text: "Explain pure and impure interpreters.", freq: 5, marks: "4, 7" },
            { text: "Construct LL(1) parsing table for the given grammar.", freq: 4, marks: "4, 7" },
            { text: "Describe following data structures: OPTAB, SYMTAB, LITTAB and POOLTAB.", freq: 4, marks: "4, 7" },
            { text: "List and explain all the tables used in macro preprocessor (MNT, KPDTAB, SSTAB, EVTAB, MDT).", freq: 4, marks: "4, 7" },
            { text: "Differentiate between linker and loader.", freq: 4, marks: "3, 4" },
            { text: "Demonstrate the use of AIF and AGO / expansion time statements.", freq: 4, marks: "3, 7" },
            { text: "Explain self-relocating program.", freq: 4, marks: "4, 7" },
            { text: "List various phases of Language Processor / Compiler. Explain each phase in detail.", freq: 4, marks: "7" },
            { text: "Compare variant I and variant II of intermediate code representation.", freq: 3, marks: "7" },
            { text: "Compare and contrast the properties of macros and subroutines.", freq: 3, marks: "3, 7" },
            { text: "What is program relocation? How it is performed by linker?", freq: 3, marks: "4, 7" },
            { text: "Explain compile-and-go loaders in brief.", freq: 3, marks: "3, 4" },
            { text: "What is overlay? Explain the linking of overlay structured program.", freq: 3, marks: "7" },
            { text: "What is Symbol table? Explain how one can organize Symbol table using Linear Data Structure?", freq: 3, marks: "7" },
            { text: "Show the difference between positional parameter and keyword parameter in macro.", freq: 3, marks: "4" },
            { text: "Explain recursive descendent parsing algorithm.", freq: 2, marks: "7" },
            { text: "What is optimizing transformation? Discuss various optimizing transformations.", freq: 2, marks: "7" },
            { text: "Explain the user-centric view and system-centric view of system software.", freq: 2, marks: "3, 4" },
            { text: "Differentiate Compiler and Interpreter.", freq: 2, marks: "3, 4" },
            { text: "Define Language Migrator, Execution gap, Semantic Gap, Specification Gap.", freq: 2, marks: "3, 4" },
            { text: "Explain Absolute loader with suitable example.", freq: 2, marks: "3, 4" },
            { text: "Write and explain an algorithm for first pass of the Linker program / Assembler.", freq: 2, marks: "7" },
            { text: "Given the source program, show intermediate code and symbol table. (Numerical)", freq: 2, marks: "7" },
            { text: "Define system software. Give difference between system software and application software.", freq: 1, marks: "3" },
            { text: "Explain Ambiguous Grammar with example.", freq: 1, marks: "3" },
            { text: "Discuss dead code elimination method with suitable example.", freq: 1, marks: "3" },
            { text: "Explain JVM in detail.", freq: 1, marks: "4, 7" },
            { text: "Define Simple Phrase and Handle. Using Handle and Simple Phrase trace the bottom up parsing algorithm.", freq: 1, marks: "7" },
            { text: "Discuss the limitations of stack based memory allocation.", freq: 1, marks: "3" },
            { text: "Explain classification of debuggers.", freq: 1, marks: "4" },
            { text: "Construct optimized DFA for the given Regular Expression.", freq: 1, marks: "7" }
        ];

        function renderQuestions(data) {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            
            data.forEach((q, index) => {
                const delay = index * 0.05;
                const freqClass = q.freq >= 5 ? 'high' : '';
                
                const card = document.createElement('div');
                card.className = 'question-card';
                card.style.animationDelay = `${delay}s`;
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="badges">
                            <span class="badge freq ${freqClass}">${q.freq} Time${q.freq > 1 ? 's' : ''}</span>
                            <span class="badge marks">${q.marks} Marks</span>
                        </div>
                    </div>
                    <div class="question-text">${q.text}</div>
                `;
                container.appendChild(card);
            });
        }

        function filterQuestions(freq) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (freq === 0) {
                renderQuestions(questionsData);
            } else {
                const filtered = questionsData.filter(q => q.freq === freq);
                renderQuestions(filtered);
            }
        }

        // Initial render
        renderQuestions(questionsData);
    </script>
</body>
</html>
