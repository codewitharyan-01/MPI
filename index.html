    <script>
        const questionsData = [
    {
        "freq": 6,
        "marks": "3, 4, 7",
        "text": "Explain assembler directives (ORIGIN, EQU, LTORG, START, END) with suitable examples.",
        "baby_explanation": "Directives are like instructions for the builder (Assembler) telling them how to set up the workspace, rather than instructions for the actual worker (CPU) to execute.",
        "answer": "<p>Assembler directives (also known as pseudo-ops) are commands placed in the source code that provide instructions directly to the assembler during the translation phase. Unlike machine instructions (like ADD or MOV), directives do not generate any executable machine code.</p><div class='rich-content'><h4>Common Directives:</h4><ul><li><strong>START:</strong> Specifies the starting physical or logical execution address of the program. It tells the assembler where to initialize the Location Counter (LC). <br><em>Example:</em> <code>START 200</code> (Initializes LC to 200).</li><li><strong>END:</strong> Indicates the absolute end of the source program. When the assembler encounters this, it stops processing the file and can trigger the final processing of the literal pool. <br><em>Example:</em> <code>END</code></li><li><strong>ORIGIN:</strong> Instructs the assembler to change the Location Counter (LC) to a specific value. Useful for reserving specific memory blocks. <br><em>Example:</em> <code>ORIGIN 500</code> (Next instruction will be assembled at address 500).</li><li><strong>EQU (Equate):</strong> Associates a symbolic name with a specific constant value or another symbol. It does not allocate memory. <br><em>Example:</em> <code>MAX EQU 100</code> (Replaces 'MAX' with 100 during assembly).</li><li><strong>LTORG (Literal Origin):</strong> Directs the assembler to immediately allocate memory locations for all literals used in the program up to that point. This creates a 'literal pool'. <br><em>Example:</em> <code>LTORG</code></li></ul></div>"
    },
    {
        "freq": 5,
        "marks": "3, 4",
        "text": "Eliminate left recursion from the given grammar.",
        "baby_explanation": "Left recursion is like a dictionary defining a word by starting with the exact same word—it creates an endless loop. We rewrite the rule to put the repeated part at the end instead.",
        "answer": "<p>In top-down parsing (like Recursive Descent or LL parsers), left recursion is a fatal flaw. A grammar is left-recursive if a non-terminal can derive a string that begins with itself (i.e., <code>A &rarr; A&alpha;</code>). This causes the parser to enter an infinite loop.</p><div class='rich-content'><h4>General Algorithm for Elimination:</h4><p>If you have a production of the form:</p><div class='code-block'>A &rarr; A&alpha;<sub>1</sub> | A&alpha;<sub>2</sub> | ... | &beta;<sub>1</sub> | &beta;<sub>2</sub> | ...</div><p>Where &beta; does not start with A. We rewrite it by creating a new non-terminal (A') to handle the recursive tail:</p><div class='code-block'>A  &rarr; &beta;<sub>1</sub>A' | &beta;<sub>2</sub>A' | ...<br>A' &rarr; &alpha;<sub>1</sub>A' | &alpha;<sub>2</sub>A' | ... | &epsilon;</div><h4>Academic Example:</h4><p>Consider the classic arithmetic expression grammar:</p><div class='code-block'>E &rarr; E + T | T</div><p>Here, &alpha; is <code>+ T</code> and &beta; is <code>T</code>. Applying the algorithm:</p><div class='code-block'>E  &rarr; TE'<br>E' &rarr; +TE' | &epsilon;</div><p>The left recursion is entirely eliminated, transforming it into right recursion which top-down parsers handle easily.</p></div>"
    },
    {
        "freq": 5,
        "marks": "4, 7",
        "text": "Explain pure and impure interpreters.",
        "baby_explanation": "A pure interpreter translates a book line-by-line while reading it out loud. An impure interpreter first rewrites the book into shorthand (IR), and then reads the shorthand out loud, which is much faster.",
        "answer": "<p>Interpreters execute source code directly. However, they are classified into two main types based on whether they perform any preliminary translation before execution.</p><table class='styled-table'><thead><tr><th>Feature</th><th>Pure Interpreter</th><th>Impure Interpreter</th></tr></thead><tbody><tr><td><strong>Translation Phase</strong></td><td>No translation is done. The interpreter processes the raw high-level source code directly.</td><td>Source code is first translated into an Intermediate Representation (IR), such as bytecode.</td></tr><tr><td><strong>Execution Phase</strong></td><td>Reads a statement, performs syntax analysis on it, and executes it immediately.</td><td>The interpreter (often a Virtual Machine) executes the generated IR.</td></tr><tr><td><strong>Performance (Speed)</strong></td><td>Very slow. If a statement is inside a loop, it must be syntax-checked and parsed repeatedly during every iteration.</td><td>Significantly faster. Syntax analysis is done only once during the IR generation phase.</td></tr><tr><td><strong>Memory Usage</strong></td><td>Requires less memory since no intermediate code is stored.</td><td>Requires more memory to hold both the runtime engine and the generated bytecode.</td></tr><tr><td><strong>Examples</strong></td><td>Early versions of LISP, BASIC, and simple shell scripts.</td><td>Java (JVM running Bytecode), Python (CPython compiling to .pyc), C#.</td></tr></tbody></table>"
    },
    {
        "freq": 4,
        "marks": "4, 7",
        "text": "Construct LL(1) parsing table for the given grammar.",
        "baby_explanation": "An LL(1) parsing table is a cheat sheet for the compiler. When it sees a certain word, the table tells it exactly which grammar rule to apply next without guessing.",
        "answer": "<p>LL(1) parsing is a top-down, predictive parsing method. The 'L' stands for Left-to-right scanning, the second 'L' for Leftmost derivation, and '1' for using 1 lookahead token. To construct the table, we must first compute the <strong>FIRST</strong> and <strong>FOLLOW</strong> sets for the grammar.</p><div class='rich-content'><h4>Prerequisites:</h4><ol><li><strong>FIRST(&alpha;):</strong> The set of terminal symbols that begin strings derived from &alpha;. If &alpha; can derive the empty string, &epsilon; is included.</li><li><strong>FOLLOW(A):</strong> The set of terminal symbols that can appear immediately to the right of non-terminal A in a derived sentence.</li></ol><h4>Table Construction Algorithm:</h4><p>For every production rule <code>A &rarr; &alpha;</code> in the grammar:</p><ul><li>For each terminal <em>a</em> in <strong>FIRST(&alpha;)</strong>, add the rule <code>A &rarr; &alpha;</code> to the table cell <code>M[A, a]</code>.</li><li>If &epsilon; is in <strong>FIRST(&alpha;)</strong>, then for each terminal <em>b</em> in <strong>FOLLOW(A)</strong>, add the rule <code>A &rarr; &alpha;</code> to the table cell <code>M[A, b]</code>.</li><li>If &epsilon; is in FIRST(&alpha;) and EOF (usually represented as <code>$</code>) is in FOLLOW(A), add <code>A &rarr; &alpha;</code> to <code>M[A, $]</code>.</li></ul><p><em>Note:</em> If any cell in the resulting table contains more than one production rule, the grammar is <strong>ambiguous</strong> or <strong>not LL(1)</strong>.</p></div>"
    },
    {
        "freq": 4,
        "marks": "4, 7",
        "text": "Describe following data structures: OPTAB, SYMTAB, LITTAB and POOLTAB.",
        "baby_explanation": "These are the assembler's notebooks: OPTAB remembers what commands mean, SYMTAB remembers variable names, LITTAB remembers hardcoded numbers, and POOLTAB organizes the numbers into sections.",
        "answer": "<p>An assembler requires several structured databases to efficiently translate assembly language into machine code across its passes.</p><div class='rich-content'><ul><li><strong>OPTAB (Operation Code Table):</strong> A static, pre-defined table that contains all valid assembly mnemonics (like ADD, SUB, JMP). For each mnemonic, it stores the corresponding binary machine opcode, the instruction format, and the length (in bytes). The assembler looks up OPTAB during Pass 1 to calculate the Location Counter and Pass 2 to generate machine code.</li><li><strong>SYMTAB (Symbol Table):</strong> A dynamic table built during Pass 1. It records all user-defined symbols (like labels for loops or variable names) along with the memory address assigned to them by the Location Counter. It is crucial for resolving forward references.</li><li><strong>LITTAB (Literal Table):</strong> A dynamic table that stores all literals (constants used directly in instructions, e.g., <code>=5</code>). It stores the literal name, its evaluated value, and the memory address assigned to it during the literal pool allocation.</li><li><strong>POOLTAB (Pool Table):</strong> Used in conjunction with LITTAB. In complex programs, literals are dumped into memory in batches (literal pools) when an <code>LTORG</code> directive is encountered. POOLTAB stores the starting index in the LITTAB for each literal pool, allowing the assembler to manage multiple pools efficiently.</li></ul></div>"
    },
    {
        "freq": 4,
        "marks": "4, 7",
        "text": "List and explain all the tables used in macro preprocessor (MNT, KPDTAB, SSTAB, EVTAB, MDT).",
        "baby_explanation": "When you create a shortcut (macro), the system uses these tables to remember the shortcut's name (MNT), the actual actions it performs (MDT), and any default settings it needs (KPDTAB).",
        "answer": "<p>A Macro Preprocessor evaluates and expands macros before the code is sent to the assembler. To handle nested macros, parameters, and conditional expansions, it relies on several specialized tables:</p><table class='styled-table'><thead><tr><th>Table Name</th><th>Full Form</th><th>Description / Role</th></tr></thead><tbody><tr><td><strong>MNT</strong></td><td>Macro Name Table</td><td>Stores the name of every defined macro. It acts as an index, containing the number of positional parameters, the number of keyword parameters, and a direct pointer to the starting line of this macro in the MDT.</td></tr><tr><td><strong>MDT</strong></td><td>Macro Definition Table</td><td>Stores the actual body of the macro. When a macro definition is processed, its statements are sequentially stored here. During a macro call, the preprocessor fetches statements from the MDT to expand them.</td></tr><tr><td><strong>KPDTAB</strong></td><td>Keyword Parameter Default Table</td><td>Stores the names of keyword parameters and their default values. If a macro call omits a keyword argument, the preprocessor retrieves the default value from this table.</td></tr><tr><td><strong>EVTAB</strong></td><td>Expansion Time Variable Table</td><td>Maintains variables that are only used during macro expansion (not at runtime). Useful for maintaining counters in macro loops (like <code>&amp;Z SET 1</code>).</td></tr><tr><td><strong>SSTAB</strong></td><td>Sequencing Symbol Table</td><td>Stores labels (sequencing symbols like <code>.LOOP</code>) used inside the macro body. This table is essential for handling conditional jumps (AIF) and unconditional jumps (AGO) during expansion.</td></tr></tbody></table>"
    },
    {
        "freq": 4,
        "marks": "3, 4",
        "text": "Differentiate between linker and loader.",
        "baby_explanation": "The Linker is the chef who gathers all the ingredients and mixes them into a single cake. The Loader is the waiter who takes the cake and places it on your table (the RAM) so you can eat (execute) it.",
        "answer": "<p>While both are essential parts of the program execution pipeline, they serve distinctly different roles in system software.</p><table class='styled-table'><thead><tr><th>Feature</th><th>Linker (Linkage Editor)</th><th>Loader</th></tr></thead><tbody><tr><td><strong>Primary Function</strong></td><td>Takes one or more object files generated by a compiler/assembler and combines them into a single executable file.</td><td>Takes the final executable file from the disk and loads it into the main memory (RAM) for execution.</td></tr><tr><td><strong>Resolution</strong></td><td>Resolves external references (e.g., linking a <code>printf</code> function call to the standard C library).</td><td>Does not resolve external references; it only places data in memory.</td></tr><tr><td><strong>Relocation</strong></td><td>Performs relocation by adjusting absolute addresses if modules are combined.</td><td>May perform final absolute relocation depending on the physical memory address allocated by the OS.</td></tr><tr><td><strong>Input</strong></td><td>Object code (.obj / .o files) and Library files (.lib / .a).</td><td>Executable files (.exe / .out).</td></tr><tr><td><strong>Output</strong></td><td>A single Executable module.</td><td>A running Process in the operating system.</td></tr></tbody></table>"
    },
    {
        "freq": 4,
        "marks": "3, 7",
        "text": "Demonstrate the use of AIF and AGO / expansion time statements.",
        "baby_explanation": "AIF is like an 'IF' statement, and AGO is like a 'GOTO' statement, but they only happen while the code is being prepared (compiled), not when you actually run the program.",
        "answer": "<p>AIF and AGO are expansion-time control statements used in macro programming. They control the flow of how a macro expands, allowing for conditional logic and loops during the pre-processing phase.</p><div class='rich-content'><ul><li><strong>AIF (Conditional Jump):</strong> Evaluates a boolean expression. If the expression is true, the macro processor jumps to a specified sequencing symbol. If false, it continues to the next line. <br><em>Syntax:</em> <code>AIF (Condition) .TargetSymbol</code></li><li><strong>AGO (Unconditional Jump):</strong> Forces the macro processor to immediately skip to a specified sequencing symbol, ignoring all lines in between. <br><em>Syntax:</em> <code>AGO .TargetSymbol</code></li></ul><h4>Academic Example (Macro Loop):</h4><p>This macro generates multiple <code>ADD</code> instructions based on the parameter passed to it.</p><div class='code-block'>MACRO<br>MULTIPLY_BY_ADD &amp;REG, &amp;VAL, &amp;COUNT<br>&amp;I SET 1                ; Initialize expansion variable<br>.LOOP AIF (&amp;I GT &amp;COUNT) .END  ; If I > COUNT, jump to END<br>      ADD &amp;REG, &amp;VAL    ; Generate ADD instruction<br>&amp;I SET &amp;I + 1           ; Increment I<br>      AGO .LOOP         ; Loop back<br>.END MEND</div><p>If called with <code>MULTIPLY_BY_ADD AREG, X, 3</code>, it will output three consecutive <code>ADD AREG, X</code> instructions.</p></div>"
    },
    {
        "freq": 4,
        "marks": "4, 7",
        "text": "Explain self-relocating program.",
        "baby_explanation": "A self-relocating program is like a self-driving car. Instead of relying on a tow truck (the loader) to put it in the right spot, it figures out where it was parked and adjusts its own internal GPS to work perfectly from that spot.",
        "answer": "<p>In standard execution, a relocating loader adjusts absolute memory addresses within a program before execution. However, a <strong>Self-Relocating Program</strong> contains its own logic to perform these address adjustments at runtime.</p><div class='rich-content'><h4>Mechanism:</h4><ol><li>The program is loaded into memory by a simple Absolute Loader (which doesn't know how to relocate).</li><li>The first piece of code to execute is the program's built-in <strong>Relocation Logic</strong>.</li><li>The program queries the CPU/OS to find its actual physical starting address in RAM.</li><li>It compares this actual address with the origin address it was compiled for, calculating the <strong>Relocation Factor</strong>.</li><li>It then iterates through a self-contained relocation table, updating all of its own address-dependent instructions in memory by adding the relocation factor.</li><li>Once self-modification is complete, it jumps to the main program execution.</li></ol><h4>Use Cases:</h4><p>Self-relocating programs are highly useful in environments where complex loaders aren't available, such as embedded systems, bootloaders, firmware, or when writing highly portable malicious payloads/viruses.</p></div>"
    },
    {
        "freq": 4,
        "marks": "7",
        "text": "List various phases of Language Processor / Compiler. Explain each phase in detail.",
        "baby_explanation": "A compiler works like an assembly line: it first reads the letters (Lexical), checks the grammar (Syntax), checks the logic (Semantic), makes a rough draft (IR), edits it to be shorter (Optimization), and finally prints the final book (Machine Code).",
        "answer": "<p>A compiler translates high-level language into machine code through a strict, multi-phase pipeline divided into Analysis (front-end) and Synthesis (back-end).</p><div class='diagram-placeholder'>Source Code &rarr; [Lexical] &rarr; [Syntax] &rarr; [Semantic] &rarr; [Intermediate Code] &rarr; [Optimization] &rarr; [Target Code] &rarr; Machine Code</div><div class='rich-content'><ol><li><strong>Lexical Analysis (Scanner):</strong> Reads the raw source code character by character and groups them into meaningful units called <em>Tokens</em> (e.g., keywords, identifiers, operators). It also removes whitespace and comments.</li><li><strong>Syntax Analysis (Parser):</strong> Takes the stream of tokens and checks them against the grammatical rules of the language. It constructs a <em>Parse Tree</em> to ensure the expressions are structurally valid.</li><li><strong>Semantic Analysis:</strong> Verifies the logical meaning of the parse tree. It checks for type compatibility (e.g., you can't multiply a string by a float), scope resolution, and variable initialization.</li><li><strong>Intermediate Code Generation (IR):</strong> Translates the semantic tree into a platform-independent intermediate language (like Three-Address Code). This bridges the gap between high-level logic and low-level execution.</li><li><strong>Code Optimization:</strong> Analyzes the IR to improve performance. It removes redundant calculations (dead code elimination, constant folding) to make the code run faster and use less memory.</li><li><strong>Target Code Generation:</strong> The final phase. It maps the optimized IR to the specific assembly or machine language instructions of the target CPU architecture, assigning registers and physical memory addresses.</li></ol></div>"
    },
    {
        "freq": 3,
        "marks": "7",
        "text": "Compare variant I and variant II of intermediate code representation.",
        "baby_explanation": "Variant I is a very detailed rough draft that forces the final editor to do lots of lookups. Variant II is a nearly finished draft where all the specific details are already filled in, making the final editor's job super fast.",
        "answer": "<p>During Pass I of a two-pass assembler, Intermediate Code (IC) is generated. This IC can be structured in two different ways depending on how much memory vs processing power you want to use.</p><table class='styled-table'><thead><tr><th>Feature</th><th>Variant I (Declarative)</th><th>Variant II (Imperative)</th></tr></thead><tbody><tr><td><strong>Operand Representation</strong></td><td>Operands are represented as a pair: <code>(Class, Code)</code>. For example, a symbol might be represented as <code>(S, 01)</code> meaning 'Symbol table entry 1'.</td><td>Operands are represented by their actual evaluated memory addresses calculated during Pass I.</td></tr><tr><td><strong>Pass II Workload</strong></td><td><strong>High.</strong> Pass II must constantly read the <code>(S, 01)</code> tag, open the SYMTAB, find entry 1, and fetch the address.</td><td><strong>Low.</strong> Pass II doesn't need to look up symbols; it just replaces mnemonics with binary and outputs the final code.</td></tr><tr><td><strong>Memory/Storage Requirement</strong></td><td><strong>Low.</strong> The IC file is very small because <code>(S, 01)</code> takes up less space than a full 32-bit memory address.</td><td><strong>High.</strong> The IC file is larger because full memory addresses are written directly into the intermediate file.</td></tr><tr><td><strong>Usage</strong></td><td>Used when disk I/O and memory are limited (older systems).</td><td>Used in modern systems where memory is cheap and speed is prioritized.</td></tr></tbody></table>"
    },
    {
        "freq": 3,
        "marks": "3, 7",

        "answer": "<p><strong>Program Relocation</strong> is the process of modifying absolute memory addresses within object code so that a program can execute correctly when loaded at an arbitrary memory address, different from the origin it was originally assembled for.</p><div class='rich-content'><h4>How the Linker Performs Relocation:</h4><ol><li><strong>Determine Load Address:</strong> The OS or user specifies the actual physical address where the program will be loaded into RAM (e.g., 5000).</li><li><strong>Calculate Relocation Factor:</strong> The linker looks at the original Translated Origin (e.g., 1000) assigned by the assembler. It calculates the difference:<br><code>Relocation Factor = Final Load Address - Translated Origin (e.g., 5000 - 1000 = 4000)</code>.</li><li><strong>Scan Relocation Dictionary:</strong> The assembler leaves behind a 'Relocation Dictionary' indicating exactly which instructions use absolute memory addresses.</li><li><strong>Update Addresses:</strong> The linker iterates through the dictionary. For every flagged instruction, it adds the Relocation Factor to the address portion. If an instruction pointed to 1050, it now points to 5050.</li><li><strong>Finalize:</strong> The fully relocated executable is written to disk, ready to be loaded directly into address 5000.</li></ol></div>"

        "answer": "<p>A <strong>Compile-and-Go loader</strong> is a system software model where the compiler, assembler, and loader are integrated into a single monolithic program. Instead of generating a permanent object file (.obj/.exe) on the hard drive, the compiler translates the source code and places the resulting machine code directly into main memory.</p><div class='rich-content'><h4>Key Characteristics:</h4><ul><li><strong>Immediate Execution:</strong> Once compilation finishes, the CPU's instruction pointer is immediately set to the starting address of the generated code in RAM.</li><li><strong>Advantages:</strong> It is incredibly fast from a user perspective since it eliminates disk I/O (no writing object files, no reading them back). It is excellent for educational environments, small scripts, or basic interpreters.</li><li><strong>Disadvantages:</strong> <ul><li>No linking is possible. You cannot compile one file today, another tomorrow, and link them together.</li><li>Memory Waste: The compiler must remain in memory alongside the executing program, taking up valuable RAM.</li><li>If the program needs to run again tomorrow, it must be completely recompiled from scratch.</li></ul></li></ul></div>"

        function renderQuestions(data) {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            
            data.forEach((q, index) => {
                const delay = index * 0.05;
                const freqClass = q.freq >= 5 ? 'high' : '';
                
                const card = document.createElement('div');
                card.className = 'question-card';
                card.style.animationDelay = `${delay}s`;
                card.onclick = function() {
                    this.classList.toggle('active');
                };
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="badges">
                            <span class="badge freq ${freqClass}">${q.freq} Time${q.freq > 1 ? 's' : ''}</span>
                            <span class="badge marks">${q.marks} Marks</span>
                        </div>
                    </div>
                    <div class="question-text">${q.text}</div>
                    <div class="answer-content">
                        <div class="baby-box">
                            <div class="baby-icon">💡</div>
                            <div><strong>Quick Explanation:</strong> ${q.baby_explanation}</div>
                        </div>
                        <div class="proper-answer">
                            ${q.answer}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterQuestions(minFreq) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (minFreq === 0) {
                renderQuestions(questionsData);
            } else if(minFreq === 4) {
                renderQuestions(questionsData.filter(q => q.freq >= 4));
            } else {
                renderQuestions(questionsData.filter(q => q.freq === minFreq));
            }
        }

        renderQuestions(questionsData);
    </script>
